name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the tests use the TF-IDF embedder, so PyTorch isn't needed here
      - run: pip install pymupdf numpy scikit-learn fastapi uvicorn python-multipart pytest httpx
      - run: pytest -q
