[project]
name = "automap"
version = "1.0.0"
description = "Turn a PDF into an interactive mind map using the document's own structure, embedding clusters and keyphrase labels."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "aniyow07" }]
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "sentence-transformers>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0", "python-dotenv>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
automap = "automap.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["automap"]
